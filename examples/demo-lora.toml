# Demo-corpus LoRA — the fixture adapter every benchmark table in
# docs/benchmarks.md is measured on (plan full-benchmark-suite, task t16).
#
# Run from the repo root:
#   sloth train --config examples/demo-lora.toml
#
# Same recipe as examples/lfm2-lora.toml (LFM2.5-1.2B-Base, preset:lfm2), but
# trained for 300 steps on examples/demo-corpus.jsonl — the 591-row chat corpus
# generated by examples/generate_suites.py that teaches the answers the
# examples/eval/ suites test — with a 10% seeded holdout for eval loss.

[run]
model   = "LiquidAI/LFM2.5-1.2B-Base"
method  = "lora"
dataset = "examples/demo-corpus.jsonl"
output  = "runs/demo-lora"

[hyperparameters]
lora_r         = 16
lora_alpha     = 16
lora_dropout   = 0.0
learning_rate  = 2e-4
max_seq_len    = 1024
batch_size     = 1
grad_accum     = 4
max_steps      = 300
seed           = 3407
load_in_4bit   = false
target_modules = "preset:lfm2"

[eval]
holdout_fraction = 0.1
seed             = 3407
eval_steps       = 50
